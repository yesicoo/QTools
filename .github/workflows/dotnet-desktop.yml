# QTools CI：构建 0 警告 → 单元测试 → 前端测试 → AOT 单文件发布 → 无头自检
name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (Release, 0 warning)
        run: dotnet build -c Release

      - name: Unit tests
        run: dotnet test -c Release --no-build

      - name: Frontend tests
        run: node --test tests/

      - name: Publish AOT single-file
        run: dotnet publish src/QTools.Host/QTools.Host.csproj -c Release -r win-x64 -o publish/win-x64

      - name: Self-test (27 HTTP assertions)
        run: ./publish/win-x64/QTools.exe --self-test

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTools-win-x64
          path: publish/win-x64/QTools.exe
